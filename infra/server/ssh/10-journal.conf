# /etc/ssh/sshd_config.d/10-journal.conf — keys only, no root (SPEC §11).
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
# Only the deploy user (created in docs/deploy.md) may log in.
AllowUsers deploy
