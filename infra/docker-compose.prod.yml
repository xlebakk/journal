# Production stack (stage 7). On the server, from the repository root:
#   docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build
# Only Caddy publishes ports (80, 443). PostgreSQL and Redis sit on an internal network
# without internet access. See docs/deploy.md.
name: journal

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-app: &app
  build:
    context: ../backend
    target: prod
  image: journal-api
  env_file: ../.env.prod
  environment: &app-env
    DB_HOST: db
    # Exactly one proxy (Caddy) in front: its X-Forwarded-For hop is the client.
    TRUSTED_PROXY_COUNT: "1"
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

services:
  db:
    image: postgres:19-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=icu --icu-locale=und"
      DB_NAME: ${DB_NAME:?}
      DB_OWNER_USER: ${DB_OWNER_USER:?}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init-prod:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sessions live here: append-only file, so a restart does not log everyone out.
    command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

  # Runs on every `up`: migrations as the owner, then the app role's privileges, then a check
  # that the app role can do nothing beyond rows. The API starts only if all three pass.
  migrate:
    <<: *app
    environment:
      <<: *app-env
      DB_USER: ${DB_OWNER_USER:?}
      DB_PASSWORD: ${DB_OWNER_PASSWORD:?}
      APP_DB_USER: ${DB_USER:?}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py db_grants --app-role "$$APP_DB_USER" &&
        python manage.py db_grants --app-role "$$APP_DB_USER" --check
    networks: [backend]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    restart: unless-stopped
    volumes:
      - media:/app/media
    networks: [backend, web]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/health', headers={'Host': os.environ['JOURNAL_DOMAIN']}), timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: infra/caddy/Dockerfile
    image: journal-web
    restart: unless-stopped
    environment:
      JOURNAL_DOMAIN: ${JOURNAL_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      JOURNAL_API: api:8000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]
    read_only: true
    tmpfs: [/tmp]
    # Caddy runs as a non-root user with no capabilities and no-new-privileges; ports 80/443
    # are allowed for unprivileged users inside this container's network namespace only.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

networks:
  # No internet from the database side.
  backend:
    internal: true
  web: {}

volumes:
  db-data:
  redis-data:
  media:
  caddy-data:
  caddy-config:
