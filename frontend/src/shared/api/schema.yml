  /api/v1/admin/audit:
    get:
      operationId: admin_audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: date_from
        schema:
          type: string
      - in: query
        name: date_to
        schema:
          type: string
      - in: query
        name: entity_id
        schema:
          type: string
      - in: query
        name: entity_type
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/admin/courses:
    get:
      operationId: admin_courses_list
      description: |-
        list / create / retrieve / PATCH / delete for administrators.

        Every write is audited in the same transaction. Deleting something still referenced
        answers 409 `in_use` (archive it instead). Database constraint violations become 400
        with `integrity_error` as the code.
      parameters:
      - in: query
        name: group
        schema:
          type: string
      - in: query
        name: teacher
        schema:
          type: string
      - in: query
        name: year
        schema:
          type: string
      tags:
      - admin
      security:
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
          description: ''
    post:
      operationId: admin_courses_create
      description: |-
        list / create / retrieve / PATCH / delete for administrators.

        Every write is audited in the same transaction. Deleting something still referenced
        answers 409 `in_use` (archive it instead). Database constraint violations become 400
        with `integrity_error` as the code.
