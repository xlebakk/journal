  /api/v1/admin/access-cards:
    get:
      operationId: admin_access_cards_retrieve
      description: 'What every access card shows besides the login and the password:
        the site and its QR.'
      tags:
      - admin
      security:
      - appBearer: []
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessCardInfo'
          description: ''
  /api/v1/admin/announcements:
    get:
      operationId: admin_announcements_list
      description: |-
        list / create / retrieve / PATCH / delete for administrators.

        Every write is audited in the same transaction. Deleting something still referenced
        answers 409 `in_use` (archive it instead). Database constraint violations become 400
        with `integrity_error` as the code.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin
      security:
      - appBearer: []
      - sessionCookie: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
    post:
