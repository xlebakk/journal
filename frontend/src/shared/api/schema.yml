components:
  schemas:
    AcademicYear:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 40
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        is_current:
          type: boolean
        grade_scale:
          $ref: '#/components/schemas/GradeScaleEnum'
      required:
      - ends_on
      - id
      - name
      - starts_on
    AcademicYearRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 40
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
        is_current:
          type: boolean
        grade_scale:
          $ref: '#/components/schemas/GradeScaleEnum'
      required:
      - ends_on
      - name
      - starts_on
    AddMemberRequest:
      type: object
      properties:
        student:
          type: string
          format: uuid
        joined_on:
          type: string
          format: date
      required:
      - joined_on
      - student
    AdminUserDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        login:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        first_name:
          type: string
          readOnly: true
        middle_name:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        status:
          type: string
          readOnly: true
        totp_enabled:
          type: boolean
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Последний вход
        created_at:
          type: string
          format: date-time
          readOnly: true
        must_change_password:
          type: boolean
          readOnly: true
        password_changed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        archived_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        student_profile:
          allOf:
          - $ref: '#/components/schemas/StudentProfile'
          readOnly: true
          nullable: true
        teacher_profile:
          allOf:
          - $ref: '#/components/schemas/TeacherProfile'
          readOnly: true
          nullable: true
        login_locked_minutes:
          type: integer
          readOnly: true
      required:
      - archived_at
      - created_at
      - first_name
      - full_name
      - id
      - last_login
      - last_name
      - login
      - login_locked_minutes
      - middle_name
      - must_change_password
      - password_changed_at
      - roles
      - status
      - student_profile
      - teacher_profile
      - totp_enabled
    AdminUserList:
      type: object
      properties:
        id:
          type: string
          format: uuid
