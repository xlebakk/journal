name: CI

on:
  push:
    branches: [main, "stage-*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: journal
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U journal" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PASSWORD: journal
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: tests
        env:
          TOTP_ENCRYPTION_KEYS: dGVzdC1vbmx5LWtleS10ZXN0LW9ubHkta2V5LTAwMDA=
        run: uv run pytest --cov --cov-report=term-missing
      - name: coverage of accounts and journal ≥ 85% (SPEC §15)
        run: |
          uv run coverage report --include="apps/accounts/*" --fail-under=85
          uv run coverage report --include="apps/journal/*" --fail-under=85
      - name: OpenAPI schema is valid and committed
        env:
          TOTP_ENCRYPTION_KEYS: dGVzdC1vbmx5LWtleS10ZXN0LW9ubHkta2V5LTAwMDA=
        run: |
          uv run python manage.py spectacular --settings=config.settings.test --validate --fail-on-warn --file /tmp/schema.yml
          diff -u ../frontend/src/shared/api/schema.yml /tmp/schema.yml
      - name: bandit
        run: uv run bandit -q -c pyproject.toml -r apps config
      - name: pip-audit
        run: uv export --frozen --format requirements-txt --no-hashes > /tmp/req.txt && uv run pip-audit -r /tmp/req.txt --strict
      - name: check --deploy
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-${{ github.run_id }}-not-a-real-secret-0123456789abcdefghijklmnop
          DJANGO_ALLOWED_HOSTS: journal.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://journal.example.com
          TOTP_ENCRYPTION_KEYS: dGVzdC1vbmx5LWtleS10ZXN0LW9ubHkta2V5LTAwMDA=
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: production DB roles — the app cannot touch the audit log (stage 7)
        working-directory: .
        env:
          SUPERUSER: journal
          SUPERUSER_PASSWORD: journal
        run: infra/scripts/check-db-roles.sh
      - name: backup retention 14 / 8 / 12
        working-directory: .
        run: uv run --project backend python -m pytest -q -p no:django infra/backup
      - name: shellcheck of the server scripts
        working-directory: .
        # warning level: at «info» shellcheck flags functions that only traps call (SC2317).
        run: shellcheck --severity=warning infra/backup/*.sh infra/scripts/*.sh infra/postgres/*/*.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match the OpenAPI schema
        run: npm run api:types && git diff --exit-code src/shared/api/schema.d.ts
      - run: npm run format:check
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm test
      - name: design tokens contrast (WCAG AA)
        run: npm run contrast
      - run: npm run build
      - name: styleguide is not shipped to production
        run: "! grep -rq 'StyleguidePage\\|Стайлгайд' dist"
      - name: PWA caches the shell only, never the API
        run: npm run check:pwa
      - name: npm audit
        run: npm audit --audit-level=moderate

  android:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: mobile
      - name: plugin versions match in frontend and mobile
        run: npm run check:versions
        working-directory: mobile
      - run: npm audit --audit-level=moderate
        working-directory: mobile
      # An unsigned debug build: the release key never leaves the owner's computer.
      - name: debug APK
        run: npm run apk:debug
        working-directory: mobile

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: journal
          POSTGRES_PASSWORD: journal
          POSTGRES_DB: journal_e2e
          POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=und"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U journal" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PASSWORD: journal
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results/

  # The production stack exactly as on the server: images, roles, Caddy with HTTPS (Caddy's
  # internal CA for «localhost»), headers, a backup → restore round trip and a ZAP baseline.
  prod-stack:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: .env.prod for a throwaway stack
        run: |
          secret() { python3 -c "import secrets; print(secrets.token_urlsafe(32))"; }
          fernet() { python3 -c "import base64, os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"; }
          cat > .env.prod <<EOF
          JOURNAL_DOMAIN=localhost
          ACME_EMAIL=ci@example.com
          DJANGO_SECRET_KEY=$(secret)$(secret)
          DJANGO_ALLOWED_HOSTS=localhost
          DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost
          TOTP_ENCRYPTION_KEYS=$(fernet)
          POSTGRES_PASSWORD=$(secret)
          DB_NAME=journal
          DB_OWNER_USER=journal_owner
          DB_OWNER_PASSWORD=$(secret)
          DB_USER=journal_app
          DB_PASSWORD=$(secret)
          REDIS_PASSWORD=$(secret)
          EOF
      - name: build and start
        run: |
          docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d --build
          # `migrate` finishes by design, so wait for the site itself rather than `--wait`.
          timeout 300 bash -c 'until curl -skf https://localhost/api/v1/health; do sleep 3; done'
      - name: HTTPS, redirect and security headers
        run: |
          curl -sk -o /dev/null -w "%{http_code} %{redirect_url}\n" http://localhost/ | grep -q "^308 https://localhost/"
          headers="$(curl -skI https://localhost/)"
          echo "$headers"
          for h in "strict-transport-security: max-age=31536000" "content-security-policy: default-src 'self'" \
                   "x-content-type-options: nosniff" "referrer-policy: same-origin" \
                   "permissions-policy: camera=()" "cross-origin-opener-policy: same-origin"; do
            echo "$headers" | grep -qi "^$h" || { echo "missing: $h"; exit 1; }
          done
          ! echo "$headers" | grep -qi "^server:"
          curl -sk https://localhost/api/v1/health | grep -q ok
          curl -skI https://localhost/api/v1/health | grep -qi "^cache-control: no-store"
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/v1/me)" = 401
      - name: nothing but Caddy listens to the world
        run: |
          published="$(docker compose -f infra/docker-compose.prod.yml --env-file .env.prod ps --format '{{.Service}} {{range .Publishers}}{{if .PublishedPort}}{{.PublishedPort}},{{end}}{{end}}')"
          echo "$published"
          echo "$published" | grep -E '^web .*443,' >/dev/null
          ! echo "$published" | grep -E '^(db|redis|api) [0-9]'
      - name: some data to back up
        run: |
          docker compose -f infra/docker-compose.prod.yml --env-file .env.prod exec -T api python manage.py shell -c "
          from django.db import transaction
          from apps.accounts.models import User
          from apps.audit import services as audit
          with transaction.atomic():
              user = User.objects.create_user(login='ci.admin', password='a-long-ci-password-42', last_name='CI', first_name='CI', roles=['admin'])
              audit.record(request=None, action='user.create', entity=user)
          "
      - name: backup tools and keys
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age rclone
          mkdir -p /tmp/offsite /tmp/local-backups
          age-keygen -o /tmp/identity.txt 2>/dev/null
          age-keygen -y /tmp/identity.txt > /tmp/recipients.txt
          {
            echo "AGE_RECIPIENTS_FILE=/tmp/recipients.txt"
            echo "AGE_IDENTITY_FILE=/tmp/identity.txt"
            echo "RCLONE_REMOTE=/tmp/offsite"
            echo "LOCAL_DIR=/tmp/local-backups"
          } > /tmp/backup.env
      - name: backup → encrypted off-site copy
        run: |
          BACKUP_ENV=/tmp/backup.env infra/backup/backup.sh 2>&1 | tee /tmp/backup.out
          ls -l /tmp/offsite
          # The off-site copy is encrypted: no SQL in clear text.
          ! grep -q "accounts_user" /tmp/offsite/*.age
      - name: restore check of the newest copy
        run: BACKUP_ENV=/tmp/backup.env infra/backup/restore-check.sh 2>&1 | tee /tmp/restore.out
      - name: both results reach «Настройки»
        run: |
          docker compose -f infra/docker-compose.prod.yml --env-file .env.prod exec -T api python manage.py shell -c "
          from apps.core.models import CenterSettings as C; s = C.load(); assert s.last_backup_ok and s.last_restore_check_ok, (s.last_backup_ok, s.last_restore_check_ok)"
      # SPEC §15 numbers, measured against the real stack (Caddy, compression, HTTPS).
      - uses: actions/setup-node@v5
        if: ${{ !cancelled() }}
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: acceptance tools
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm ci
      - name: Mozilla HTTP Observatory — grade A+ (SPEC §15)
        if: ${{ !cancelled() }}
        run: |
          docker compose -f infra/docker-compose.prod.yml --env-file .env.prod cp             web:/data/caddy/pki/authorities/local/root.crt /tmp/caddy-root.crt
          cd frontend
          NODE_EXTRA_CA_CERTS=/tmp/caddy-root.crt node node_modules/@mdn/mdn-http-observatory/src/scan.js localhost > /tmp/observatory.json
          python3 - <<'PY'
          import json
          result = json.load(open("/tmp/observatory.json"))
          scan = result["scan"]
          failed = [f"{k}: {v.get('result')}" for k, v in result["tests"].items() if not v.get("pass")]
          summary = f"grade {scan['grade']}, score {scan['score']}"
          print(summary)
          print("::notice title=Observatory::" + summary + "%0A" + "%0A".join(failed))
          assert scan["grade"] == "A+", failed
          PY
      - name: a student with a current year for Lighthouse
        if: ${{ !cancelled() }}
        run: |
          docker compose -f infra/docker-compose.prod.yml --env-file .env.prod exec -T api python manage.py shell -c "
          from datetime import timedelta
          from django.utils import timezone
          from apps.academics.models import AcademicYear
          from apps.accounts.models import StudentProfile, User
          today = timezone.localdate()
          AcademicYear.objects.create(name='CI', starts_on=today - timedelta(days=60), ends_on=today + timedelta(days=200), is_current=True)
          student = User.objects.create_user(login='ci.student', password='a-long-ci-password-42', last_name='CI', first_name='Student', roles=['student'])
          StudentProfile.objects.create(user=student)
          "
      - name: Lighthouse — accessibility ≥ 95, performance ≥ 90 (SPEC §15)
        if: ${{ !cancelled() }}
        working-directory: frontend
        env:
          BASE_URL: https://localhost
          STUDENT_LOGIN: ci.student
          STUDENT_PASSWORD: a-long-ci-password-42
        run: |
          set -o pipefail
          node scripts/lighthouse.mjs 2>&1 | tee /tmp/lighthouse.out
          echo "::notice title=Lighthouse::$(grep -E '^[✓✗]' /tmp/lighthouse.out | awk 'BEGIN { ORS = "%0A" } { print }')"
      - name: OWASP ZAP baseline (SPEC §11)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://localhost/ -r zap-report.html -J zap-report.json -I \
            2>&1 | tee /tmp/zap.out
      - name: ZAP summary as a public annotation
        if: ${{ !cancelled() }}
        run: |
          summary="$(grep -E '^(WARN-NEW|FAIL-NEW|FAIL-INPROG|PASS)' /tmp/zap.out | grep -v '^PASS:' | awk 'BEGIN { ORS = "%0A" } { print }')"
          totals="$(grep -E '^FAIL-NEW: [0-9]+' /tmp/zap.out)"
          echo "::notice title=ZAP baseline: $totals::$summary"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap/
      # Job logs need a login to read; annotations are public, so failures are summarised there.
      - name: failure details as annotations
        if: failure()
        run: |
          oneline() { awk 'BEGIN { ORS = "%0A" } { print }'; }
          for f in /tmp/lighthouse.out /tmp/observatory.json /tmp/zap.out /tmp/backup.out /tmp/restore.out; do
            if [ -f "$f" ]; then echo "::error title=$(basename "$f")::$(tail -n 25 "$f" | oneline)"; fi
          done
          for svc in api db web; do
            out="$(docker compose -f infra/docker-compose.prod.yml --env-file .env.prod logs --no-color --tail 15 "$svc" 2>&1 | oneline)"
            echo "::warning title=logs of $svc::$out"
          done
      - name: logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.prod.yml --env-file .env.prod logs --no-color --tail 200
