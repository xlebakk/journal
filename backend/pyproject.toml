[project]
name = "journal-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1",
    "django>=5.2,<5.3",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.1",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pyotp>=2.12.1",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.2",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
    "types-openpyxl>=3.1.5.20261122",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "SIM", "RUF", "PT"]
# Russian UI: Cyrillic in strings and comments is intended.
# S105: constants like "password_changed" are names, not secrets (secrets come from env).
ignore = ["RUF001", "RUF002", "RUF003", "S105"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106", "E501"]
"conftest.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["drf_spectacular.*", "django_redis.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B105"]
